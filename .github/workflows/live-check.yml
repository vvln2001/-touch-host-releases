# TEMPORARY: after a release, update REAL old builds (downloaded from this repo's releases) through the PUBLIC signed
# manifest (no test server, no test key) and check version, restart and that old settings survive. Removed afterwards.
name: live-check
on:
  workflow_dispatch:
    inputs:
      expect:
        required: true
permissions:
  contents: read
jobs:
  live:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - old: "2.4.0"
            sha: f55a4f512f62d0b5a3e121613326587a0c28fe27a65ccc2a20461cb177f1f199
            regkey: 'HKCU\Software\A1semi\ASDM02A-NewHost'
          - old: "2.4.2"
            sha: 35d5a5a89de78746b35c80b4da20f734dac0b0877f38d6728622ad07a9414604
            regkey: 'HKCU\Software\A1semi\ASDM02A-NewHost'
          - old: "2.4.3"
            sha: 98270e9d08b3959fd8a1211765d4b1785f4feadbc48c83769279557a29036663
            regkey: 'HKCU\Software\ASDM02A Host\ASDM02A-Host'
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        shell: pwsh
    steps:
      - name: ${{ matrix.old }} -> ${{ inputs.expect }} via the public manifest
        env:
          OLD: ${{ matrix.old }}
          SHA: ${{ matrix.sha }}
          REGKEY: ${{ matrix.regkey }}
          EXPECT: ${{ inputs.expect }}
        run: |
          $ErrorActionPreference = "Stop"
          $z = Join-Path $env:RUNNER_TEMP "old.zip"
          Invoke-WebRequest -Uri "https://github.com/$env:GITHUB_REPOSITORY/releases/download/v$env:OLD/ASDM02A-Host-$env:OLD-win64.zip" -OutFile $z
          if ((Get-FileHash -Algorithm SHA256 $z).Hash.ToLower() -ne $env:SHA) { throw "old zip sha mismatch" }
          $root = "C:\测试 目录 $env:OLD"
          Expand-Archive $z -DestinationPath $root
          $inst = Join-Path $root "ASDM02A-Host"
          # settings the user had in the old version
          reg add "$env:REGKEY" /v theme /t REG_SZ /d dark /f | Out-Null
          reg add "$env:REGKEY" /v live_check_marker /t REG_SZ /d keep-$env:OLD /f | Out-Null
          $st = & "$inst\asdm-cli.exe" --json update status | ConvertFrom-Json
          Write-Host "before: version $($st.version)"
          if ($st.version -ne $env:OLD) { throw "old version is $($st.version)" }
          $chk = & "$inst\asdm-cli.exe" --json update check | ConvertFrom-Json
          Write-Host ("check: " + ($chk | ConvertTo-Json -Compress -Depth 4))
          if ($chk.status -ne "update" -or $chk.latest -ne $env:EXPECT) { throw "update not detected" }
          $ap = & "$inst\asdm-cli.exe" --json update apply --target host --yes | ConvertFrom-Json
          Write-Host ("apply: " + ($ap | ConvertTo-Json -Compress -Depth 4))
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep 5
            try { $v = (& "$inst\asdm-cli.exe" --json update status | ConvertFrom-Json).version } catch { $v = "?" }
            if ($v -eq $env:EXPECT -and -not (Get-Process ota-updater* -ErrorAction SilentlyContinue)) { $ok = $true; break }
          }
          Get-ChildItem -Recurse -Filter updater.log $env:LOCALAPPDATA, $env:USERPROFILE -ErrorAction SilentlyContinue | Select-Object -First 1 | ForEach-Object { Get-Content $_.FullName -Tail 40 }
          if (-not $ok) { throw "installed version is $v, expected $env:EXPECT" }
          $f = (Get-Item "$inst\ASDM02A-Host.exe").VersionInfo
          Write-Host "after: CLI $v, GUI FileVersion $($f.FileVersion), Product '$($f.ProductName)'"
          if ($f.FileVersion -ne $env:EXPECT) { throw "GUI exe FileVersion $($f.FileVersion)" }
          # start the new GUI once (as the user would) and check the old settings are there
          $p = Start-Process "$inst\ASDM02A-Host.exe" -ArgumentList "--sim" -PassThru
          Start-Sleep 25
          if ($p.HasExited) { throw "new GUI exited early with $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          $new = 'HKCU:\Software\ASDM02A Host\ASDM02A-Host'
          $m = (Get-ItemProperty -Path $new -Name live_check_marker -ErrorAction SilentlyContinue).live_check_marker
          $t = (Get-ItemProperty -Path $new -Name theme -ErrorAction SilentlyContinue).theme
          Write-Host "settings after update: marker=$m theme=$t"
          if ($m -ne "keep-$env:OLD" -or $t -ne "dark") { throw "old settings lost" }
          Write-Host "LIVE OK: $env:OLD -> $env:EXPECT (public manifest), restarted, settings kept"
